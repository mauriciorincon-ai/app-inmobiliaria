allowBuilds:
  sharp: true
  unrs-resolver: true
  '@swc/core': true
  esbuild: true
  '@tailwindcss/oxide': true
  '@sentry/cli': false
  # workerd (runtime de Cloudflare): habilitado desde el aprovisionamiento S1 — lo necesitan
  # `pnpm preview:cf` y `pnpm deploy:cf` (ADR 001). CI no lo usa (sus jobs no despliegan).
  workerd: true
  # core-js (transitivo de posthog-js, S3): su postinstall es solo un mensaje de donación, cero
  # build funcional → NO se construye.
  core-js: false
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - '@swc/core'
  - esbuild
  - '@tailwindcss/oxide'
  - workerd
ignoredBuiltDependencies:
  - '@sentry/cli'
  - core-js
overrides:
  # postcss <8.5.10: XSS por </style> sin escapar (moderate, transitivo de next/sentry/opennext).
  # Herramienta de build (Tailwind); forzamos la versión parchada.
  postcss@<8.5.23: '>=8.5.23'
  # dompurify (transitivo de posthog-js): hook IN_PLACE deja un nodo suelto. Moderate; el 2026-10-25 un aviso CRÍTICO
  # (GHSA-mrv2-3pqr-j5jr) y uno alto pidieron >=3.4.17, misma línea 3.4.
  dompurify: '>=3.4.17'
  # Avisos altos publicados entre la CI del S3 (2026-07) y esta entrega (2026-08). TODOS son
  # transitivos de herramientas de desarrollo —wrangler/miniflare, vitest/jsdom, postcss, eslint—
  # y ninguno corre en producción, pero el gate `pnpm audit --audit-level high` los bloquea.
  # Cada parche está DENTRO de su misma línea mayor: no hay salto que rompa APIs.
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@>=5: 5.0.12
  js-yaml@4: 4.3.2
  fast-uri: 3.1.9
  sharp: 0.35.5
  undici: 7.30.1
  nanoid@3: 3.3.18
  # Avisos del 2026-10 (S4): source-map-js (alto, DoS por mapas indexados; transitivo de postcss dentro de next)
  # y proxy-addr (CRÍTICO, suplantación de IP por IPv4 mapeado; transitivo de @opennextjs/aws > express).
  source-map-js@1: 1.2.2
  proxy-addr@2: 2.0.8
  # glob CLI (alto, inyección de comandos con -c/--cmd; transitivo de @opennextjs/aws > @node-minify/core). Parche en la misma línea 10.
  glob@10: 10.5.0
  # vite 8.0.0–8.1.5 (alto, `fs.existsSync()` se puede eludir en Windows; GHSA-587h-7wmj-h5pm; transitivo de vitest y su cobertura,
  # solo desarrollo). Aviso publicado el 2026-10-20, el mismo día del S11. Parche en la misma línea 8.1.
  vite@8: 8.1.6
  # Avisos del 2026-10-25 (S13), todos con parche en su misma línea: zod <4.6.6 (alto, agota memoria con colecciones grandes;
  # transitivo de eslint-config-next > eslint-plugin-react-hooks, solo desarrollo; GHSA-mrhx-c7xc-m3w5) y body-parser 2.0–2.3
  # (alto, DoS por bytes tras un cuerpo comprimido; transitivo de @opennextjs/aws > express; GHSA-27r3-jxmh-p828).
  zod@<4.6.6: 4.6.7
  body-parser@2: 2.4.0
  # Avisos del 2026-10-25 (S16), moderados y con parche en su misma línea: qs <6.16.0 (transitivo de @opennextjs/aws > express)
  # y fast-uri <3.1.9 (sube el pin de arriba).
  qs@6: 6.16.1

# Excepción de audit (regla 18: un advisory SIN parche es excepción con ADR, nunca silencio). Ver decisions/011.
# braces <=3.0.3 (alto, agotamiento de pila con patrones anidados): la última publicada es 3.0.3, no existe 3.0.4.
# Solo llega por eslint-config-next > fast-glob > micromatch (lint en desarrollo; patrones del propio repo, nunca de un usuario).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
